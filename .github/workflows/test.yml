name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Syntax checks
        run: |
          node --check app.js
          node --check sw.js

      - name: Tests
        run: npm test
