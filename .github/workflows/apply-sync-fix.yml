name: Apply sync reliability patch

on:
  push:
    branches:
      - fix/sync-orchestration-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sync-orchestration-reliability

      - name: Apply sync patch
        run: |
          python3 tools/apply-sync-fix.py
          tail -n +2 tests/client-sync-structure.js > /tmp/client-sync-structure.js
          mv /tmp/client-sync-structure.js tests/client-sync-structure.js

      - name: Validate JavaScript and tests
        run: |
          node --check app.js
          node --check sw.js
          node --check tests/client-sync-structure.js
          npm test

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js sw.js package.json tests/client-sync-structure.js
          git commit -m 'fix: serialize multi-device synchronization'
          git push origin HEAD:fix/sync-orchestration-reliability
