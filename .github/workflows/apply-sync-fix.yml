name: Apply sync reliability patch

on:
  push:
    branches:
      - fix/sync-orchestration-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/sync-orchestration-reliability

      - name: Finalize sync guards
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          old = """    syncCyclePromise = (async () => {
                const flushOk = await flushOutbox();
                const pullOk = await cloudPull();
                const ok = flushOk && pullOk;
                lastError = !ok;
                return ok;
              })();
          """.replace('              ', '    ', 1).replace('                ', '      ')
          new = """    syncCyclePromise = (async () => {
                const flushOk = await flushOutbox();
                if (!flushOk) {
                  lastError = true;
                  return false;
                }
                const pullOk = await cloudPull();
                lastError = !pullOk;
                if (!pullOk) scheduleRetry();
                else {
                  clearTimeout(retryTimer);
                  retryDelay = 0;
                }
                return pullOk;
              })();
          """.replace('              ', '    ', 1).replace('                ', '      ')
          if s.count(old) != 1:
              raise SystemExit(f'sync cycle block: expected 1 match, got {s.count(old)}')
          s = s.replace(old, new, 1)

          old_edit = """  function isEditingTime() {
              const modal = document.getElementById('time-modal');
              if (modal && !modal.classList.contains('hidden')) return true;
              const active = document.activeElement;
              return !!(active && active.classList && active.classList.contains('cell-input'));
            }
          """.replace('            ', '')
          new_edit = """  function isEditingTime() {
              const modal = document.getElementById('time-modal');
              return !!(modal && !modal.classList.contains('hidden'));
            }
          """.replace('            ', '')
          if s.count(old_edit) != 1:
              raise SystemExit(f'editing guard: expected 1 match, got {s.count(old_edit)}')
          s = s.replace(old_edit, new_edit, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('tests/client-sync-structure.js')
          ts = t.read_text(encoding='utf-8')
          anchor = "ok(pull > push, 'le pull ne démarre qu’après la fin du push');\n"
          extra = "ok(cycle.indexOf('if (!flushOk)') > push && cycle.indexOf('if (!flushOk)') < pull, 'un push échoué empêche le pull distant');\n"
          if extra not in ts:
              if anchor not in ts:
                  raise SystemExit('test anchor missing')
              ts = ts.replace(anchor, anchor + extra, 1)
          t.write_text(ts, encoding='utf-8')
          PY

      - name: Validate JavaScript and tests
        run: |
          node --check app.js
          node --check sw.js
          node --check tests/client-sync-structure.js
          npm test

      - name: Commit final guards
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js tests/client-sync-structure.js
          git commit -m 'fix: tighten sync retry and editing guards'
          git push origin HEAD:fix/sync-orchestration-reliability
